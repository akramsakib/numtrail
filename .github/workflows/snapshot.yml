name: snapshot

# The "backend on GitHub": Actions does the probing, the repo stores the
# results, GitHub Pages serves them. No server, no third-party account.
#
# Every run rewrites numtrail/web/static/snapshots.json and commits it if it
# changed, which triggers the Pages deploy. Result: a static site that shows
# real, timestamped probe output for the numbers in watchlist.txt.

on:
  schedule:
    - cron: "23 */6 * * *"     # four times a day (UTC)
  # Clicking "Run workflow" opens a form: type a number, get a probe, get the
  # answer in this run's summary and on the site. That is the query box — the
  # page itself can't trigger a workflow without leaking a write-scoped token.
  workflow_dispatch:
    inputs:
      number:
        description: "Phone number with dial code, e.g. +60123456789 (comma-separate several; leave blank for the watchlist)"
        required: false
        type: string
      skip_watchlist:
        description: "Probe only the number above (faster; leaves the watchlist out of this run)"
        required: false
        default: false
        type: boolean
  push:
    paths:                       # re-probe when the watchlist or the probes change
      - "watchlist.txt"
      - "numtrail/modules/**"
      - "numtrail/catalog.py"
      - ".github/workflows/snapshot.yml"

permissions:
  contents: write                # needs to commit the snapshot back
  actions: write                 # ...and to re-run the Pages deploy afterwards

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet -e .

      - name: Probe
        env:
          # Add any of these as repository secrets to light up the keyed probes.
          # Settings → Secrets and variables → Actions → Secrets.
          NUMVERIFY_KEY: ${{ secrets.NUMVERIFY_KEY }}
          VERIPHONE_KEY: ${{ secrets.VERIPHONE_KEY }}
          ABSTRACTAPI_PHONE_KEY: ${{ secrets.ABSTRACTAPI_PHONE_KEY }}
          IPQS_KEY: ${{ secrets.IPQS_KEY }}
          NUMLOOKUPAPI_KEY: ${{ secrets.NUMLOOKUPAPI_KEY }}
          TRESTLE_API_KEY: ${{ secrets.TRESTLE_API_KEY }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          VONAGE_API_KEY: ${{ secrets.VONAGE_API_KEY }}
          VONAGE_API_SECRET: ${{ secrets.VONAGE_API_SECRET }}
          TELESIGN_CUSTOMER_ID: ${{ secrets.TELESIGN_CUSTOMER_ID }}
          TELESIGN_API_KEY: ${{ secrets.TELESIGN_API_KEY }}
          PLIVO_AUTH_ID: ${{ secrets.PLIVO_AUTH_ID }}
          PLIVO_AUTH_TOKEN: ${{ secrets.PLIVO_AUTH_TOKEN }}
          BIRD_ACCESS_KEY: ${{ secrets.BIRD_ACCESS_KEY }}
          MOCEAN_API_KEY: ${{ secrets.MOCEAN_API_KEY }}
          MOCEAN_API_SECRET: ${{ secrets.MOCEAN_API_SECRET }}
          # Optional: a residential proxy makes the three web probes answer
          # instead of bot-walling a datacentre IP.
          PROXY_URL: ${{ secrets.PROXY_URL }}
        env:
          # Set by the Run-workflow form. Empty on schedule/push runs, which
          # then behave exactly as before.
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_SKIP_WATCHLIST: ${{ inputs.skip_watchlist }}
        run: |
          python -m numtrail.catalog --write
          ARGS=()
          if [ -n "$INPUT_NUMBER" ]; then
            ARGS+=(--number "$INPUT_NUMBER")
            echo "on-demand number: $INPUT_NUMBER"
          fi
          if [ "$INPUT_SKIP_WATCHLIST" = "true" ]; then
            ARGS+=(--skip-watchlist)
          fi
          python -m numtrail.snapshot --watchlist watchlist.txt \
            --out numtrail/web/static/snapshots.json "${ARGS[@]}"

      - name: Commit if anything changed
        env:
          INPUT_NUMBER: ${{ inputs.number }}
        run: |
          git config user.name  "numtrail snapshot bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add numtrail/web/static/snapshots.json numtrail/web/static/catalog.json
          if git diff --cached --quiet; then
            echo "no change to commit"
            exit 0
          fi
          if [ -n "$INPUT_NUMBER" ]; then
            git commit -m "snapshot: probe $INPUT_NUMBER (Run workflow)"
          else
            git commit -m "snapshot: $(date -u +'%Y-%m-%dT%H:%M:%SZ') watchlist probe results"
          fi
          # Another run can push between our checkout and our push (a push to
          # watchlist.txt or the probes fires this workflow too), so rebase and
          # retry instead of failing the job.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed on attempt $attempt"
              break
            fi
            echo "push attempt $attempt failed; retrying"
            sleep 5
            [ "$attempt" = 3 ] && exit 1
          done

      # Commits pushed with GITHUB_TOKEN do not trigger other workflows (that is
      # GitHub's anti-recursion rule), so the Pages build has to be dispatched
      # explicitly or the site would keep serving the previous snapshot.
      - name: Redeploy Pages with the new snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref main || echo "dispatch failed; next push will redeploy"

      - name: Job summary
        if: always()
        env:
          INPUT_NUMBER: ${{ inputs.number }}
        run: |
          {
            echo "### snapshot"
            echo
            python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("numtrail/web/static/snapshots.json")
          site = "https://akramsakib.github.io/numtrail/"
          if not p.is_file():
              print("_no snapshot written — the probe step failed before it could_")
          else:
              d = json.loads(p.read_text())
              asked = (os.environ.get("INPUT_NUMBER") or "").strip()
              print(f"generated `{d['generated_at']}` · "
                    f"{d['watchlist_size']} watchlisted · "
                    f"{d.get('dispatch_size', 0)} on demand · "
                    f"credentials: {', '.join(d['credentials_present']) or 'none'} · "
                    f"proxy: {'yes' if d['proxy'] else 'no'}")
              print()
              print("| number | source | conclusive | statuses |")
              print("| --- | --- | --- | --- |")
              for n, e in d["entries"].items():
                  tally = {}
                  for r in e["results"]:
                      tally[r["status"]] = tally.get(r["status"], 0) + 1
                  print(f"| `{n}` | {e.get('source', 'watchlist')} | {e['conclusive']} | "
                        f"{', '.join(f'{k}={v}' for k, v in sorted(tally.items()))} |")
              for n, e in d["entries"].items():
                  if e.get("source") != "dispatch":
                      continue
                  print()
                  print(f"#### `{n}` — {e.get('pretty') or n}")
                  asked_this = bool(asked) and (e["iso"].lower() in asked.lower()
                                                or n.endswith("".join(c for c in asked if c.isdigit())[-9:]))
                  if asked_this:
                      print()
                      print(f"**[open this number on the site]({site}#%s)**" % n.replace("+", "%2B"))
                  for r in e["results"]:
                      flag = "**found**" if r["found"] else r["status"]
                      print(f"- `{r['module']}` — {flag}"
                            + (f" — {r['detail']}" if r["detail"] else ""))
          PY
          } >> "$GITHUB_STEP_SUMMARY"
