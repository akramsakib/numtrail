name: deploy web UI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # regenerate catalog.json from numtrail/catalog.py so the site can never
      # drift from the source of truth
      - name: Regenerate catalogue
        run: |
          python -m pip install --quiet httpx beautifulsoup4
          python -m numtrail.catalog --write

      # If you set the repository variable NUMTRAIL_API_BASE (Settings ->
      # Secrets and variables -> Actions -> Variables) to your worker URL, the
      # deployed page talks to it with no manual editing. Leave it unset and the
      # page shows the setup panel instead of pretending to have results.
      - name: Point the UI at the API
        run: |
          API_BASE="${{ vars.NUMTRAIL_API_BASE }}"
          REPO_URL="${{ github.server_url }}/${{ github.repository }}"
          python - "$API_BASE" "$REPO_URL" <<'PY'
          import json, pathlib, sys
          api_base, repo_url = (sys.argv[1] or "").rstrip("/"), sys.argv[2]
          cfg = pathlib.Path("numtrail/web/static/config.js")
          cfg.write_text(
              "// generated by .github/workflows/pages.yml\n"
              "window.NUMTRAIL_CONFIG = " + json.dumps(
                  {"apiBase": api_base, "repoUrl": repo_url}, indent=2) + ";\n"
          )
          print("apiBase =", api_base or "(none - setup panel will show)")
          PY

      - name: Stage site
        run: |
          mkdir -p _site
          cp -r numtrail/web/static/. _site/
          rm -f _site/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
