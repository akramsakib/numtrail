[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numtrail"
version = "0.1.0"
description = "Trace where a phone number is registered, with a pluggable module registry."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "numtrail contributors" }]
keywords = ["osint", "phone", "enumeration", "reconnaissance"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Environment :: Console",
    "Topic :: Security",
]
dependencies = ["httpx>=0.27", "beautifulsoup4>=4.12"]

[project.urls]
Homepage = "https://akramsakib.github.io/numtrail/"
Source = "https://github.com/akramsakib/numtrail"
Deployment = "https://github.com/akramsakib/numtrail/blob/main/DEPLOY.md"
Issues = "https://github.com/akramsakib/numtrail/issues"

[project.optional-dependencies]
pretty = ["rich>=13"]
dev = ["pytest>=8", "rich>=13"]

[project.scripts]
numtrail = "numtrail.cli:main"
numtrail-web = "numtrail.web.server:main"

[tool.setuptools.packages.find]
include = ["numtrail*"]

[tool.setuptools.package-data]
numtrail = ["web/static/*", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
